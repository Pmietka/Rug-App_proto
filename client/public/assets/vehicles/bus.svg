<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 65 25" width="65" height="25">
  <!-- Bus body (yellow) -->
  <rect x="2" y="4" width="61" height="17" fill="#f0c020" rx="3"/>
  <!-- Roof/top strip -->
  <rect x="3" y="5" width="59" height="15" fill="#f8d030" rx="2"/>
  <!-- Windows row -->
  <rect x="6" y="8" width="8" height="7" fill="#a8d8f0" rx="1" opacity="0.9"/>
  <rect x="17" y="8" width="8" height="7" fill="#a8d8f0" rx="1" opacity="0.9"/>
  <rect x="28" y="8" width="8" height="7" fill="#a8d8f0" rx="1" opacity="0.9"/>
  <rect x="39" y="8" width="8" height="7" fill="#a8d8f0" rx="1" opacity="0.9"/>
  <rect x="50" y="8" width="8" height="7" fill="#a8d8f0" rx="1" opacity="0.9"/>
  <!-- Front window -->
  <rect x="56" y="7" width="6" height="9" fill="#a8d8f0" rx="1" opacity="0.9"/>
  <!-- Bumpers -->
  <rect x="0" y="7" width="4" height="11" fill="#c0a010" rx="2"/>
  <rect x="61" y="7" width="4" height="11" fill="#c0a010" rx="2"/>
  <!-- Door (right side, near front) -->
  <rect x="45" y="8" width="7" height="13" fill="#d0a010" rx="1"/>
  <line x1="48.5" y1="8" x2="48.5" y2="21" stroke="#b08010" stroke-width="1"/>
  <!-- Wheels -->
  <rect x="4" y="1" width="10" height="5" fill="#333" rx="2"/>
  <rect x="46" y="1" width="10" height="5" fill="#333" rx="2"/>
  <rect x="4" y="19" width="10" height="5" fill="#333" rx="2"/>
  <rect x="46" y="19" width="10" height="5" fill="#333" rx="2"/>
  <!-- Wheel hubs -->
  <circle cx="9" cy="3" r="2" fill="#555"/>
  <circle cx="51" cy="3" r="2" fill="#555"/>
  <circle cx="9" cy="22" r="2" fill="#555"/>
  <circle cx="51" cy="22" r="2" fill="#555"/>
  <!-- School bus stripe (black) -->
  <rect x="2" y="13" width="61" height="3" fill="#333" opacity="0.3"/>
  <!-- Headlights -->
  <ellipse cx="3" cy="10" rx="1.5" ry="1.5" fill="#f8f8a0"/>
  <ellipse cx="3" cy="15" rx="1.5" ry="1.5" fill="#f8f8a0"/>
  <!-- Taillights -->
  <ellipse cx="62" cy="10" rx="1.5" ry="1.5" fill="#f03030"/>
  <ellipse cx="62" cy="15" rx="1.5" ry="1.5" fill="#f03030"/>
</svg>
