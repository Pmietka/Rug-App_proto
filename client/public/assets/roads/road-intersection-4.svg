<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- Green grass background -->
  <rect x="0" y="0" width="60" height="60" fill="#7ec850"/>
  <!-- 4-way intersection: full horizontal and vertical roads crossing -->
  <!-- Horizontal road -->
  <rect x="0" y="20" width="60" height="20" fill="#c8c8b0"/>
  <!-- Vertical road -->
  <rect x="20" y="0" width="20" height="60" fill="#c8c8b0"/>
  <!-- Edge lines horizontal -->
  <line x1="0" y1="23" x2="20" y2="23" stroke="#a0a088" stroke-width="1.5"/>
  <line x1="40" y1="23" x2="60" y2="23" stroke="#a0a088" stroke-width="1.5"/>
  <line x1="0" y1="37" x2="20" y2="37" stroke="#a0a088" stroke-width="1.5"/>
  <line x1="40" y1="37" x2="60" y2="37" stroke="#a0a088" stroke-width="1.5"/>
  <!-- Edge lines vertical -->
  <line x1="23" y1="0" x2="23" y2="20" stroke="#a0a088" stroke-width="1.5"/>
  <line x1="37" y1="0" x2="37" y2="20" stroke="#a0a088" stroke-width="1.5"/>
  <line x1="23" y1="40" x2="23" y2="60" stroke="#a0a088" stroke-width="1.5"/>
  <line x1="37" y1="40" x2="37" y2="60" stroke="#a0a088" stroke-width="1.5"/>
  <!-- Center lines -->
  <line x1="0" y1="30" x2="20" y2="30" stroke="white" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="40" y1="30" x2="60" y2="30" stroke="white" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="30" y1="0" x2="30" y2="20" stroke="white" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="30" y1="40" x2="30" y2="60" stroke="white" stroke-width="2" stroke-dasharray="8,5"/>
  <!-- Center dot -->
  <circle cx="30" cy="30" r="3" fill="white" opacity="0.6"/>
</svg>
