<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- Green grass background -->
  <rect x="0" y="0" width="60" height="60" fill="#7ec850"/>
  <!-- Road: connects left side to top, curving at bottom-left corner (0,60) -->
  <path d="
    M 0,0
    L 20,0
    A 20,20 0 0,1 60,40
    L 60,60
    L 0,60
    Z
  " fill="#c8c8b0"/>
  <!-- Center line -->
  <path d="M 0,50 A 50,50 0 0,1 50,0" stroke="white" stroke-width="2.5" fill="none" stroke-dasharray="10,7"/>
  <!-- Edge lines -->
  <path d="M 0,57 A 57,57 0 0,1 57,0" stroke="#a0a088" stroke-width="1.5" fill="none"/>
  <path d="M 0,43 A 43,43 0 0,1 43,0" stroke="#a0a088" stroke-width="1.5" fill="none"/>
</svg>
