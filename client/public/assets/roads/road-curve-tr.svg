<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- Green grass background -->
  <rect x="0" y="0" width="60" height="60" fill="#7ec850"/>
  <!-- Road: connects right side to bottom, curving at top-right corner (60,0) -->
  <!-- Road fills: from right edge down and from bottom up, meeting at arc centered at (60,0) -->
  <path d="
    M 60,60
    L 40,60
    A 40,40 0 0,1 0,20
    L 0,0
    L 60,0
    Z
  " fill="#c8c8b0"/>
  <!-- Center line -->
  <path d="M 60,10 A 50,50 0 0,1 10,60" stroke="white" stroke-width="2.5" fill="none" stroke-dasharray="10,7"/>
  <!-- Edge lines -->
  <path d="M 60,3 A 57,57 0 0,1 3,60" stroke="#a0a088" stroke-width="1.5" fill="none"/>
  <path d="M 60,17 A 43,43 0 0,1 17,60" stroke="#a0a088" stroke-width="1.5" fill="none"/>
</svg>
