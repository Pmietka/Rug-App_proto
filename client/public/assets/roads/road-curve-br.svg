<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- Green grass background -->
  <rect x="0" y="0" width="60" height="60" fill="#7ec850"/>
  <!-- Road: connects right side to top, curving at bottom-right corner (60,60) -->
  <path d="
    M 60,0
    L 40,0
    A 40,40 0 0,0 0,40
    L 0,60
    L 60,60
    Z
  " fill="#c8c8b0"/>
  <!-- Center line -->
  <path d="M 60,50 A 50,50 0 0,0 10,0" stroke="white" stroke-width="2.5" fill="none" stroke-dasharray="10,7"/>
  <!-- Edge lines -->
  <path d="M 60,57 A 57,57 0 0,0 3,0" stroke="#a0a088" stroke-width="1.5" fill="none"/>
  <path d="M 60,43 A 43,43 0 0,0 17,0" stroke="#a0a088" stroke-width="1.5" fill="none"/>
</svg>
