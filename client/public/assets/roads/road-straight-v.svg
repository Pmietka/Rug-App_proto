<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 100" width="40" height="100">
  <!-- Road surface -->
  <rect x="0" y="0" width="40" height="100" fill="#c8c8b0"/>
  <!-- Road edge lines -->
  <line x1="3" y1="0" x2="3" y2="100" stroke="#a0a088" stroke-width="1.5"/>
  <line x1="37" y1="0" x2="37" y2="100" stroke="#a0a088" stroke-width="1.5"/>
  <!-- White dashed center line -->
  <line x1="20" y1="0" x2="20" y2="100" stroke="white" stroke-width="2.5" stroke-dasharray="12,8"/>
</svg>
