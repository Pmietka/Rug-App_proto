  <!-- Legs -->
  <rect x="6" y="22" width="4" height="7" fill="#a08040" rx="1"/>
  <rect x="18" y="22" width="4" height="7" fill="#a08040" rx="1"/>
  <rect x="28" y="22" width="4" height="7" fill="#a08040" rx="1"/>
  <rect x="40" y="22" width="4" height="7" fill="#a08040" rx="1"/>
  <!-- Armrests -->
  <rect x="4" y="15" width="5" height="3" fill="#b89050" rx="1"/>
  <rect x="41" y="15" width="5" height="3" fill="#b89050" rx="1"/>
</svg>
