<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100" height="60">
  <!-- Sky background -->
  <rect x="0" y="0" width="100" height="60" fill="#c8e8f8"/>
  <!-- Clouds at base -->
  <ellipse cx="10" cy="55" rx="14" ry="8" fill="white"/>
  <ellipse cx="90" cy="55" rx="14" ry="8" fill="white"/>
  <!-- Rainbow arcs (outermost to innermost) -->
  <!-- Red -->
  <path d="M 5,58 A 45,45 0 0,1 95,58" stroke="#e83030" stroke-width="6" fill="none"/>
  <!-- Orange -->
  <path d="M 9,58 A 41,41 0 0,1 91,58" stroke="#f07820" stroke-width="6" fill="none"/>
  <!-- Yellow -->
  <path d="M 13,58 A 37,37 0 0,1 87,58" stroke="#f0d020" stroke-width="6" fill="none"/>
  <!-- Green -->
  <path d="M 17,58 A 33,33 0 0,1 83,58" stroke="#40b830" stroke-width="6" fill="none"/>
  <!-- Blue -->
  <path d="M 21,58 A 29,29 0 0,1 79,58" stroke="#3070d0" stroke-width="6" fill="none"/>
  <!-- Indigo -->
  <path d="M 25,58 A 25,25 0 0,1 75,58" stroke="#5040a0" stroke-width="6" fill="none"/>
  <!-- Violet -->
  <path d="M 29,58 A 21,21 0 0,1 71,58" stroke="#9030b0" stroke-width="6" fill="none"/>
  <!-- Small clouds -->
  <ellipse cx="20" cy="42" rx="9" ry="5" fill="white" opacity="0.8"/>
  <ellipse cx="15" cy="44" rx="7" ry="4" fill="white" opacity="0.8"/>
  <ellipse cx="25" cy="44" rx="7" ry="4" fill="white" opacity="0.8"/>
</svg>
