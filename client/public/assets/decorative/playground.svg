<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 70" width="80" height="70">
  <!-- Grass base -->
  <rect x="0" y="55" width="80" height="15" fill="#7ec850"/>
  <rect x="0" y="0" width="80" height="70" fill="#98d868"/>
  <!-- Sand pit (oval) -->
  <ellipse cx="40" cy="58" rx="38" ry="10" fill="#e8c878"/>
  <!-- Slide structure -->
  <!-- Ladder posts -->
  <rect x="10" y="20" width="4" height="38" fill="#e04040" rx="2"/>
  <rect x="24" y="20" width="4" height="38" fill="#e04040" rx="2"/>
  <!-- Ladder rungs -->
  <line x1="10" y1="28" x2="28" y2="28" stroke="#e04040" stroke-width="3" stroke-linecap="round"/>
  <line x1="10" y1="36" x2="28" y2="36" stroke="#e04040" stroke-width="3" stroke-linecap="round"/>
  <line x1="10" y1="44" x2="28" y2="44" stroke="#e04040" stroke-width="3" stroke-linecap="round"/>
  <!-- Platform at top -->
  <rect x="8" y="16" width="20" height="8" fill="#e05050" rx="2"/>
  <!-- Slide (diagonal) -->
  <path d="M 28,20 L 52,55 L 56,53 L 32,18 Z" fill="#f0d020"/>
  <path d="M 28,20 L 52,55" stroke="#c0a010" stroke-width="1.5" fill="none"/>
  <!-- Swing frame (A-frame) -->
  <!-- Left post -->
  <line x1="58" y1="55" x2="64" y2="18" stroke="#40a040" stroke-width="4" stroke-linecap="round"/>
  <!-- Right post -->
  <line x1="78" y1="55" x2="72" y2="18" stroke="#40a040" stroke-width="4" stroke-linecap="round"/>
  <!-- Top bar -->
  <line x1="64" y1="18" x2="72" y2="18" stroke="#40a040" stroke-width="4" stroke-linecap="round"/>
  <!-- Swing chains -->
  <line x1="66" y1="18" x2="64" y2="38" stroke="#888" stroke-width="1.5"/>
  <line x1="70" y1="18" x2="72" y2="38" stroke="#888" stroke-width="1.5"/>
  <!-- Swing seat -->
  <rect x="62" y="38" width="12" height="4" fill="#5090d0" rx="2"/>
</svg>
