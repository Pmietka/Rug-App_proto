<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 80" width="60" height="80">
  <!-- Balloon body (big colorful teardrop) -->
  <!-- Main balloon shape -->
  <ellipse cx="30" cy="32" rx="24" ry="28" fill="#e03030"/>
  <!-- Color panels -->
  <path d="M 30,4 Q 54,32 30,60 Q 42,60 42,32 Q 54,4 30,4 Z" fill="#f0a020"/>
  <path d="M 30,4 Q 6,32 30,60 Q 18,60 18,32 Q 6,4 30,4 Z" fill="#f0a020"/>
  <path d="M 30,4 Q 54,32 30,60 Q 42,60 42,32 Q 54,4 30,4 Z" fill="#f0a020" opacity="0.5"/>
  <!-- Stripe overlay for nicer panels -->
  <path d="M 30,4 A 24,28 0 0,1 54,32 Q 52,20 42,12 Z" fill="#f0d020"/>
  <path d="M 30,4 A 24,28 0 0,0 6,32 Q 8,20 18,12 Z" fill="#f0d020"/>
  <path d="M 6,32 A 24,28 0 0,0 30,60 Q 16,52 12,42 Z" fill="#40b840"/>
  <path d="M 54,32 A 24,28 0 0,1 30,60 Q 44,52 48,42 Z" fill="#40b840"/>
  <!-- Balloon outline -->
  <ellipse cx="30" cy="32" rx="24" ry="28" fill="none" stroke="#c02020" stroke-width="2"/>
  <!-- Ropes -->
  <line x1="22" y1="58" x2="18" y2="68" stroke="#8b6030" stroke-width="1.5"/>
  <line x1="38" y1="58" x2="42" y2="68" stroke="#8b6030" stroke-width="1.5"/>
  <line x1="26" y1="60" x2="24" y2="68" stroke="#8b6030" stroke-width="1.5"/>
  <line x1="34" y1="60" x2="36" y2="68" stroke="#8b6030" stroke-width="1.5"/>
  <!-- Basket -->
  <rect x="18" y="66" width="24" height="12" fill="#c8a060" rx="3"/>
  <!-- Basket weave lines -->
  <line x1="26" y1="66" x2="26" y2="78" stroke="#a08040" stroke-width="1"/>
  <line x1="34" y1="66" x2="34" y2="78" stroke="#a08040" stroke-width="1"/>
  <line x1="18" y1="72" x2="42" y2="72" stroke="#a08040" stroke-width="1"/>
  <!-- Flame -->
  <ellipse cx="30" cy="61" rx="3" ry="4" fill="#f0a020"/>
  <ellipse cx="30" cy="60" rx="2" ry="3" fill="#f0d020"/>
</svg>
