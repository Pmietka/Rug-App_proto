<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50" width="100" height="50">
  <!-- Grass banks -->
  <rect x="0" y="0" width="100" height="50" fill="#7ec850"/>
  <!-- River body -->
  <path d="M 0,10 Q 25,8 50,14 Q 75,20 100,12 L 100,38 Q 75,30 50,36 Q 25,42 0,40 Z" fill="#5090d0"/>
  <!-- Water shimmer lines -->
  <path d="M 5,20 Q 25,16 45,22 Q 65,28 85,22" stroke="#a8d0f0" stroke-width="1.5" fill="none"/>
  <path d="M 5,30 Q 25,26 45,32 Q 65,38 85,30" stroke="#a8d0f0" stroke-width="1.2" fill="none"/>
  <!-- Wave details -->
  <path d="M 10,25 Q 18,22 26,25 Q 34,28 42,25 Q 50,22 58,25 Q 66,28 74,25 Q 82,22 90,25" stroke="#70b0e0" stroke-width="1" fill="none"/>
  <!-- Bank grass tufts left -->
  <path d="M 0,10 Q 5,6 10,10" stroke="#5aaa30" stroke-width="2" fill="none"/>
  <path d="M 20,8 Q 25,4 30,8" stroke="#5aaa30" stroke-width="2" fill="none"/>
  <!-- Bank grass tufts right -->
  <path d="M 0,40 Q 5,44 10,40" stroke="#5aaa30" stroke-width="2" fill="none"/>
  <path d="M 20,42 Q 25,46 30,42" stroke="#5aaa30" stroke-width="2" fill="none"/>
</svg>
