<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" width="80" height="60">
  <!-- Sky / background -->
  <rect x="0" y="0" width="80" height="60" fill="#a8d0f0"/>
  <!-- Ground -->
  <rect x="0" y="48" width="80" height="12" fill="#7ec850"/>
  <!-- Back mountain (lighter) -->
  <polygon points="15,48 50,10 80,48" fill="#9090b8"/>
  <!-- Front mountain (main) -->
  <polygon points="0,48 35,8 65,48" fill="#7878a8"/>
  <!-- Snow cap back -->
  <polygon points="36,14 50,10 58,22 48,20 40,24" fill="white"/>
  <!-- Snow cap front -->
  <polygon points="24,20 35,8 46,20 40,26 30,24" fill="white"/>
  <!-- Snow detail lines -->
  <path d="M 28,22 Q 35,12 42,22" stroke="#e0eef5" stroke-width="1" fill="none"/>
  <!-- Mountain shadow side -->
  <polygon points="35,8 65,48 50,48" fill="#6868a0" opacity="0.4"/>
</svg>
