<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 60" width="40" height="60">
  <!-- Tree trunk -->
  <rect x="17" y="48" width="6" height="10" fill="#8b5e3c" rx="1"/>
  <!-- Bottom layer (widest) -->
  <polygon points="4,50 20,28 36,50" fill="#3a8c28"/>
  <!-- Middle layer -->
  <polygon points="7,38 20,18 33,38" fill="#44a030"/>
  <!-- Top layer (narrowest) -->
  <polygon points="11,26 20,8 29,26" fill="#52b838"/>
  <!-- Snow on top layer -->
  <polygon points="13,24 20,10 27,24" fill="#d8eef5" opacity="0.7"/>
  <!-- Snow on middle layer -->
  <polygon points="9,36 20,20 31,36" fill="#d8eef5" opacity="0.4"/>
</svg>
