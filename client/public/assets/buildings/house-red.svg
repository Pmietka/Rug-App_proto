<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- Green ground -->
  <rect x="0" y="50" width="60" height="10" fill="#7ec850"/>
  <!-- House walls (cream) -->
  <rect x="8" y="28" width="44" height="22" fill="#f5f0e0" rx="2"/>
  <!-- Roof (red) -->
  <polygon points="4,30 30,8 56,30" fill="#e03030"/>
  <!-- Roof outline -->
  <polygon points="4,30 30,8 56,30" fill="none" stroke="#b52020" stroke-width="1.5"/>
  <!-- Chimney -->
  <rect x="38" y="12" width="6" height="12" fill="#c86428"/>
  <!-- Door (brown) -->
  <rect x="24" y="38" width="12" height="12" fill="#a05020" rx="1"/>
  <!-- Door knob -->
  <circle cx="34" cy="44" r="1.2" fill="#f0c040"/>
  <!-- Left window -->
  <rect x="11" y="33" width="10" height="9" fill="#a8d8f0" rx="1"/>
  <line x1="16" y1="33" x2="16" y2="42" stroke="white" stroke-width="1"/>
  <line x1="11" y1="37.5" x2="21" y2="37.5" stroke="white" stroke-width="1"/>
  <!-- Right window -->
  <rect x="39" y="33" width="10" height="9" fill="#a8d8f0" rx="1"/>
  <line x1="44" y1="33" x2="44" y2="42" stroke="white" stroke-width="1"/>
  <line x1="39" y1="37.5" x2="49" y2="37.5" stroke="white" stroke-width="1"/>
</svg>
