<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="70" height="70">
  <!-- Green ground -->
  <rect x="0" y="60" width="70" height="10" fill="#7ec850"/>
  <!-- Main building (white) -->
  <rect x="5" y="22" width="60" height="38" fill="#f0f0f0" rx="2"/>
  <!-- Roof trim (light blue) -->
  <rect x="3" y="18" width="64" height="7" fill="#5090d0" rx="2"/>
  <!-- Center section elevated -->
  <rect x="22" y="12" width="26" height="12" fill="#f0f0f0" rx="2"/>
  <rect x="20" y="10" width="30" height="5" fill="#5090d0" rx="1"/>
  <!-- Large red cross on building -->
  <rect x="29" y="26" width="12" height="32" fill="#e03030" rx="1"/>
  <rect x="22" y="33" width="26" height="12" fill="#e03030" rx="1"/>
  <!-- White cross outline to separate cross arms from background -->
  <rect x="30" y="27" width="10" height="30" fill="#e03030"/>
  <rect x="23" y="34" width="24" height="10" fill="#e03030"/>
  <!-- Clean white cross -->
  <rect x="30" y="28" width="10" height="28" fill="white"/>
  <rect x="24" y="35" width="22" height="10" fill="white"/>
  <!-- Cross symbol centered -->
  <rect x="31" y="30" width="8" height="24" fill="#e03030" rx="1"/>
  <rect x="26" y="36" width="18" height="8" fill="#e03030" rx="1"/>
  <!-- Windows sides -->
  <rect x="8" y="28" width="12" height="10" fill="#a8d8f0" rx="1"/>
  <line x1="14" y1="28" x2="14" y2="38" stroke="white" stroke-width="1"/>
  <line x1="8" y1="33" x2="20" y2="33" stroke="white" stroke-width="1"/>
  <rect x="50" y="28" width="12" height="10" fill="#a8d8f0" rx="1"/>
  <line x1="56" y1="28" x2="56" y2="38" stroke="white" stroke-width="1"/>
  <line x1="50" y1="33" x2="62" y2="33" stroke="white" stroke-width="1"/>
  <!-- Door (blue) -->
  <rect x="28" y="50" width="14" height="10" fill="#5090d0" rx="1"/>
  <!-- Hospital text -->
  <rect x="12" y="14" width="18" height="6" fill="#5090d0" rx="1"/>
  <text x="21" y="18.5" font-size="3.5" font-family="sans-serif" font-weight="bold" fill="white" text-anchor="middle">HOSPITAL</text>
</svg>
