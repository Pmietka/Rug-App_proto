<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="70" height="70">
  <!-- Green ground -->
  <rect x="0" y="60" width="70" height="10" fill="#7ec850"/>
  <!-- Barn body (red) -->
  <rect x="5" y="28" width="60" height="32" fill="#c83020" rx="2"/>
  <!-- Barn roof (dark red, gambrel shape) -->
  <!-- Upper roof -->
  <polygon points="20,28 35,10 50,28" fill="#8b1a10"/>
  <!-- Lower roof (wide) -->
  <polygon points="2,28 20,28 50,28 68,28 68,35 2,35" fill="#a02018"/>
  <!-- Roof peak cap -->
  <rect x="19" y="9" width="32" height="4" fill="#8b1a10" rx="1"/>
  <!-- Large barn doors with X pattern -->
  <rect x="15" y="40" width="16" height="20" fill="#7a1808" rx="1"/>
  <rect x="39" y="40" width="16" height="20" fill="#7a1808" rx="1"/>
  <!-- White X on left door -->
  <line x1="15" y1="40" x2="31" y2="60" stroke="white" stroke-width="2.5"/>
  <line x1="31" y1="40" x2="15" y2="60" stroke="white" stroke-width="2.5"/>
  <!-- White X on right door -->
  <line x1="39" y1="40" x2="55" y2="60" stroke="white" stroke-width="2.5"/>
  <line x1="55" y1="40" x2="39" y2="60" stroke="white" stroke-width="2.5"/>
  <!-- Hayloft window (semicircle) -->
  <ellipse cx="35" cy="26" rx="8" ry="5" fill="#f0d080"/>
  <path d="M 27,26 A 8,5 0 0,1 43,26 Z" fill="#7a1808"/>
  <!-- Side windows -->
  <rect x="7" y="33" width="8" height="7" fill="#f0d080" rx="1"/>
  <rect x="55" y="33" width="8" height="7" fill="#f0d080" rx="1"/>
  <!-- Weathervane -->
  <line x1="35" y1="2" x2="35" y2="10" stroke="#888" stroke-width="1.5"/>
  <line x1="28" y1="5" x2="42" y2="5" stroke="#888" stroke-width="1.5"/>
  <polygon points="42,3 50,5 42,7" fill="#c0a020"/>
</svg>
