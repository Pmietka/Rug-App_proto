<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 80" width="60" height="80">
  <!-- Green ground -->
  <rect x="0" y="70" width="60" height="10" fill="#7ec850"/>
  <!-- Main building (white/cream) -->
  <rect x="8" y="40" width="44" height="30" fill="#f5f0e0" rx="2"/>
  <!-- Roof over main body -->
  <polygon points="6,42 30,24 54,42" fill="#6060b0"/>
  <polygon points="6,42 30,24 54,42" fill="none" stroke="#4040a0" stroke-width="1.5"/>
  <!-- Steeple base -->
  <rect x="24" y="10" width="12" height="20" fill="#f5f0e0" rx="1"/>
  <!-- Steeple roof -->
  <polygon points="22,12 30,0 38,12" fill="#6060b0"/>
  <!-- Cross on steeple -->
  <line x1="30" y1="3" x2="30" y2="14" stroke="#f0c040" stroke-width="2.5"/>
  <line x1="25" y1="7" x2="35" y2="7" stroke="#f0c040" stroke-width="2.5"/>
  <!-- Door (arched) -->
  <rect x="23" y="54" width="14" height="16" fill="#7a3010" rx="7"/>
  <!-- Windows -->
  <rect x="11" y="46" width="10" height="10" fill="#a8d8f0" rx="5"/>
  <rect x="39" y="46" width="10" height="10" fill="#a8d8f0" rx="5"/>
  <!-- Window cross details -->
  <line x1="16" y1="46" x2="16" y2="56" stroke="white" stroke-width="1"/>
  <line x1="11" y1="51" x2="21" y2="51" stroke="white" stroke-width="1"/>
  <line x1="44" y1="46" x2="44" y2="56" stroke="white" stroke-width="1"/>
  <line x1="39" y1="51" x2="49" y2="51" stroke="white" stroke-width="1"/>
</svg>
