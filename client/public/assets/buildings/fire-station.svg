<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="70" height="70">
  <!-- Green ground -->
  <rect x="0" y="60" width="70" height="10" fill="#7ec850"/>
  <!-- Main building (red) -->
  <rect x="5" y="25" width="60" height="35" fill="#e03030" rx="2"/>
  <!-- Roof -->
  <rect x="3" y="20" width="64" height="8" fill="#b02020" rx="2"/>
  <!-- Roof peak -->
  <polygon points="3,22 35,8 67,22" fill="#c02828"/>
  <!-- Large garage doors (white) -->
  <rect x="8" y="38" width="22" height="18" fill="#f5f5f5" rx="2"/>
  <rect x="40" y="38" width="22" height="18" fill="#f5f5f5" rx="2"/>
  <!-- Garage door panels -->
  <line x1="8" y1="44" x2="30" y2="44" stroke="#ddd" stroke-width="1"/>
  <line x1="8" y1="50" x2="30" y2="50" stroke="#ddd" stroke-width="1"/>
  <line x1="40" y1="44" x2="62" y2="44" stroke="#ddd" stroke-width="1"/>
  <line x1="40" y1="50" x2="62" y2="50" stroke="#ddd" stroke-width="1"/>
  <!-- Windows above doors -->
  <rect x="12" y="28" width="14" height="10" fill="#a8d8f0" rx="1"/>
  <rect x="44" y="28" width="14" height="10" fill="#a8d8f0" rx="1"/>
  <line x1="19" y1="28" x2="19" y2="38" stroke="white" stroke-width="1"/>
  <line x1="51" y1="28" x2="51" y2="38" stroke="white" stroke-width="1"/>
  <!-- Fire station sign -->
  <rect x="23" y="28" width="24" height="8" fill="#f5f0e0" rx="1"/>
  <text x="35" y="34" font-size="4" font-family="sans-serif" font-weight="bold" fill="#e03030" text-anchor="middle">FIRE</text>
  <!-- Flagpole with red flag -->
  <line x1="35" y1="2" x2="35" y2="12" stroke="#888" stroke-width="1.5"/>
  <polygon points="35,2 48,5 35,8" fill="#e03030"/>
</svg>
