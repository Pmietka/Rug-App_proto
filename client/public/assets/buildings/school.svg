<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Green ground -->
  <rect x="0" y="68" width="80" height="12" fill="#7ec850"/>
  <!-- Main building (brick red) -->
  <rect x="5" y="30" width="70" height="38" fill="#c84830" rx="2"/>
  <!-- Roof / top trim -->
  <rect x="3" y="26" width="74" height="8" fill="#a03020" rx="2"/>
  <!-- Center entrance bump -->
  <rect x="28" y="20" width="24" height="14" fill="#a03020" rx="2"/>
  <!-- Flag pole -->
  <line x1="40" y1="4" x2="40" y2="22" stroke="#888" stroke-width="1.5"/>
  <!-- Flag -->
  <polygon points="40,4 56,8 40,12" fill="#e03030"/>
  <!-- Windows row 1 -->
  <rect x="9" y="36" width="12" height="10" fill="#a8d8f0" rx="1"/>
  <line x1="15" y1="36" x2="15" y2="46" stroke="white" stroke-width="1"/>
  <line x1="9" y1="41" x2="21" y2="41" stroke="white" stroke-width="1"/>
  <rect x="26" y="36" width="12" height="10" fill="#a8d8f0" rx="1"/>
  <line x1="32" y1="36" x2="32" y2="46" stroke="white" stroke-width="1"/>
  <line x1="26" y1="41" x2="38" y2="41" stroke="white" stroke-width="1"/>
  <rect x="43" y="36" width="12" height="10" fill="#a8d8f0" rx="1"/>
  <line x1="49" y1="36" x2="49" y2="46" stroke="white" stroke-width="1"/>
  <line x1="43" y1="41" x2="55" y2="41" stroke="white" stroke-width="1"/>
  <rect x="60" y="36" width="12" height="10" fill="#a8d8f0" rx="1"/>
  <line x1="66" y1="36" x2="66" y2="46" stroke="white" stroke-width="1"/>
  <line x1="60" y1="41" x2="72" y2="41" stroke="white" stroke-width="1"/>
  <!-- Door (double door) -->
  <rect x="32" y="54" width="16" height="14" fill="#7a3010" rx="1"/>
  <line x1="40" y1="54" x2="40" y2="68" stroke="#a05020" stroke-width="1"/>
  <circle cx="37" cy="62" r="1.2" fill="#f0c040"/>
  <circle cx="43" cy="62" r="1.2" fill="#f0c040"/>
  <!-- "SCHOOL" sign -->
  <rect x="26" y="50" width="28" height="6" fill="#f5f0e0" rx="1"/>
  <text x="40" y="55.5" font-size="4.5" font-family="sans-serif" font-weight="bold" fill="#333" text-anchor="middle">SCHOOL</text>
</svg>
